<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><title>Begin Again</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ff;background:#08111f}body{margin:0;background:linear-gradient(160deg,#08111f,#13233a);min-height:100vh}.app{max-width:520px;margin:auto;padding:24px 18px 48px}.kicker{letter-spacing:.22em;color:#57d68d;font-weight:800;font-size:12px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end}.xp{text-align:right}.xp strong{font-size:28px}.card{background:#101c2e;border:1px solid #26364c;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 12px 35px #0004}.habit{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}.icon{font-size:32px}.habit h2{font-size:17px;margin:0}.habit p{color:#9fb0c6;font-size:13px;margin:3px 0 12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.yes{background:#24a866;color:#fff}.no{background:#25354b;color:#dce5f2}.selected{outline:3px solid #fff8}.submit{width:100%;background:#57d68d;color:#06120b;font-size:17px;margin:6px 0 14px}.submit:disabled{opacity:.4;cursor:not-allowed}.closed{border-color:#2e9b60;background:#0d2b20}.closed h2{margin:0 0 6px}.history{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{text-align:center;background:#0b1524;border-radius:10px;padding:9px 2px;font-size:11px}.dot{width:9px;height:9px;border-radius:50%;margin:5px auto;background:#45566d}.dot.done{background:#41d17d}.reset{width:100%;background:transparent;color:#8fa3bd;text-decoration:underline}.note{font-size:12px;color:#8093ab;text-align:center;margin-top:16px}</style></head><body><main class="app"><div class="top"><div><div class="kicker">BEGIN AGAIN</div><h1>Today</h1><div id="date"></div></div><div class="xp"><small>TODAY'S XP</small><br><strong id="xp">0</strong><small> XP</small></div></div><div id="habits"></div><div id="closeArea"></div><section class="card"><h2>7-day history</h2><div class="history" id="history"></div></section><button class="reset" id="reset">Reopen / reset today's check-in</button><p class="note">v0.2 · Data is stored on this device/browser.</p></main><script>
const habits=[{id:'molly',icon:'🐕',title:'Walked Molly before work',desc:'Morning walk completed before work starts.'},{id:'exercise',icon:'🏃',title:'30+ minutes exercise',desc:'At least 30 minutes of exercise today.'},{id:'protein',icon:'🥩',title:'Hit protein goal',desc:'Daily protein target achieved.'}];const key='beginAgain.v02';const iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};const today=iso(new Date());let db={};try{db=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};db[today]??={values:{},closed:false};if(!db[today].values)db[today]={values:db[today],closed:false};const save=()=>localStorage.setItem(key,JSON.stringify(db));
function render(){const rec=db[today];document.getElementById('date').textContent=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long'}).format(new Date());let wrap=document.getElementById('habits');wrap.innerHTML='';habits.forEach(h=>{let v=rec.values[h.id];let c=document.createElement('section');c.className='card';c.innerHTML=`<div class="habit"><div class="icon">${h.icon}</div><div><h2>${h.title}</h2><p>${h.desc}</p><div class="buttons"><button type="button" class="yes ${v==='yes'?'selected':''}" ${rec.closed?'disabled':''}>✓ Yes</button><button type="button" class="no ${v==='no'?'selected':''}" ${rec.closed?'disabled':''}>Not today</button></div></div></div>`;c.querySelector('.yes').onclick=()=>{rec.values[h.id]='yes';save();render()};c.querySelector('.no').onclick=()=>{rec.values[h.id]='no';save();render()};wrap.appendChild(c)});document.getElementById('xp').textContent=0;let answered=habits.every(h=>rec.values[h.id]);let area=document.getElementById('closeArea');if(rec.closed){let yes=habits.filter(h=>rec.values[h.id]==='yes').length;area.innerHTML=`<section class="card closed"><h2>✓ Day closed</h2><div>${yes} of ${habits.length} habits completed. Come back tomorrow and Begin Again.</div></section>`}else{area.innerHTML=`<button type="button" id="submitDay" class="submit" ${answered?'':'disabled'}>Close the day</button><div style="text-align:center;color:#8093ab;font-size:12px;margin-top:-7px">${answered?'Lock in today’s check-in.':'Answer all three check-ins to close the day.'}</div>`;let b=document.getElementById('submitDay');if(b)b.onclick=()=>{if(answered){rec.closed=true;rec.closedAt=new Date().toISOString();save();render()}}}let hist=document.getElementById('history');hist.innerHTML='';for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=iso(d),r=db[k]||{},vals=r.values||r,n=habits.filter(h=>vals[h.id]==='yes').length;let e=document.createElement('div');e.className='day';e.innerHTML=`${new Intl.DateTimeFormat('en-GB',{weekday:'short'}).format(d)}<div class="dot ${r.closed?'done':''}"></div>${n}/3`;hist.appendChild(e)}}
document.getElementById('reset').onclick=()=>{db[today]={values:{},closed:false};save();render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
